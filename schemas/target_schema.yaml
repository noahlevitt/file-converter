# ---------------------------------------------------------------------------
# TARGET SCHEMA — Generic import file format
# Source: generic-import-format.md (provided 2026-10-09)
#
# Output rules from the spec:
#   - Headers exactly as below: lowercase, in this order, no extra columns.
#   - Keep every header even when the whole column is blank.
#   - Blank cell when there is no value.
#   - consent is ALWAYS blank (true subscribes unknown consumers, false opts people out).
#   - phone_number: 10 digits only (area code + number), no +1, spaces, dashes or parentheses.
#     A row without a phone number fails → rejected (bad row).
#   - Activity columns: MM/DD/YYYY HH:MM AM/PM (12-hour, no seconds, no time zone).
#   - birthday / anniversary: MM/DD/YYYY; month + day with no year → year 1600.
#
# Field attributes are documented in README.md ("Setting the target schema").
# ---------------------------------------------------------------------------

name: Generic import format
version: "1.0"
description: Consumer import file — phone number, activity timestamps, birthday and anniversary.

output:
  format: csv
  delimiter: ","
  encoding: utf-8
  include_header: true
  quote_all: false
  line_terminator: "\n"

# A row is a duplicate only when EVERY column matches an earlier row
# ("*" = all fields). Same phone with any different date → both rows import.
dedupe:
  keys: ["*"]
  keep: first

fields:
  - name: phone_number
    header: phone_number
    type: phone
    required: true
    format: digits10
    # 10-digit North American numbers (US and territories, Canada).
    countries: [US, CA, PR, VI, GU, AS, MP]
    description: Consumer's mobile number
    synonyms: [phone, phone number, mobile, mobile phone, mobile number, cell, cell phone, cell number,
               telephone, tel, contact number, sms number, primary phone, customer phone, guest phone,
               "phone #", "cell #", "mobile #", phone1, msisdn]

  - name: consent
    header: consent
    type: string
    fixed_blank: true
    description: Always blank. A blank consent never changes anyone's consent.

  - name: calls_last
    header: calls_last
    type: datetime
    format: "%m/%d/%Y %I:%M %p"
    description: When the consumer last called
    synonyms: [last call, last called, last call date, last call time, last phone call, last inbound call,
               call date, recent call, calls last]

  - name: transactions_last
    header: transactions_last
    type: datetime
    format: "%m/%d/%Y %I:%M %p"
    description: When the consumer last made a transaction / order / visit
    synonyms: [last transaction, last transaction date, last order, last order date, last ordered,
               last purchase, last purchase date, last visit, last visit date, last sale, recent order,
               last check, last receipt, transactions last]

  - name: last_contacted
    header: last_contacted
    type: datetime
    format: "%m/%d/%Y %I:%M %p"
    description: When the business last contacted (messaged) the consumer
    synonyms: [last contact, last contacted date, last message sent, last sms sent, last text sent,
               last outreach, last campaign, last campaign sent, last messaged, date last contacted]

  - name: in_sms_last
    header: in_sms_last
    type: datetime
    format: "%m/%d/%Y %I:%M %p"
    description: When the consumer last sent an inbound text
    synonyms: [last inbound sms, last sms received, last text received, last incoming text, last incoming sms,
               last reply, last replied, last message received, last inbound message, in sms last]

  - name: redemptions_last
    header: redemptions_last
    type: datetime
    format: "%m/%d/%Y %I:%M %p"
    description: When the consumer last redeemed an offer, coupon or reward
    synonyms: [last redemption, last redemption date, last redeemed, last coupon redeemed, last reward redeemed,
               last offer redeemed, last reward, redemption date, redemptions last]

  - name: spin_last
    header: spin_last
    type: datetime
    format: "%m/%d/%Y %I:%M %p"
    description: When the consumer last played spin-to-win
    synonyms: [last spin, last spin date, spin date, last wheel spin, spin to win, last game played, spin last]

  - name: birthday
    header: birthday
    type: date
    format: "%m/%d/%Y"
    no_year_value: 1600
    description: Birthday; month and day only is fine
    synonyms: [birth date, birthdate, dob, date of birth, bday, b-day, birth day, birthday date]

  - name: anniversary
    header: anniversary
    type: date
    format: "%m/%d/%Y"
    no_year_value: 1600
    description: Anniversary; month and day only is fine
    synonyms: [anniversary date, wedding anniversary, anniv, wedding date]
