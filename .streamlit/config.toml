# Streamlit settings for the web app (read automatically when Streamlit starts from the project folder).
# Reference: https://docs.streamlit.io/develop/api-reference/configuration/config.toml

[server]
# Largest file that can be uploaded on the New import page.
maxUploadSize = 200          # MB
# Don't try to open a browser window on the server.
headless = true
# Protect form posts and uploads against cross-site request forgery.
enableXsrfProtection = true

[browser]
# Don't send usage statistics to Streamlit.
gatherUsageStats = false

[theme]
# Blue accent (buttons, links), shared by both modes unless a mode sets its own.
primaryColor = "#2563EB"

# A light and a dark theme. With both defined, Streamlit's automatic theme follows the browser's light/dark
# setting, which the app's light/dark toggle (top right, see app.py "Light / dark mode") overrides per user.
[theme.light]
base = "light"

[theme.dark]
base = "dark"
# A slightly lighter blue reads better on the dark background.
primaryColor = "#3B82F6"

[client]
# Hide developer menu items from regular users.
toolbarMode = "minimal"
# Legacy value false = "stacktrace" in Streamlit 1.65: on an error users still see the exception type and
# traceback, but not the exception message. Full details always go to the server log (docker compose logs / the
# terminal). Use "none" to hide errors from users completely.
showErrorDetails = false
